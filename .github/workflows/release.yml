name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The release is tagged after the app version baked into tauri.conf.json,
      # so a mismatched tag must fail here instead of publishing under the
      # conf version's tag name.
      - name: Verify the tag matches the app version
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the app version v${version}." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds both platforms in parallel; tauri-action creates the GitHub
      # release from the first finished job and uploads into it from the rest.
      # Artifacts are unsigned, so installers show the usual Gatekeeper and
      # SmartScreen first-run warnings.
      - name: Build and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Atrium v__VERSION__"
          releaseBody: "Download the installer for your platform from the assets below."
          releaseDraft: false
          prerelease: false

  normalize-assets:
    name: Normalize asset names
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Drop the WiX language suffix from MSI asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The WiX bundler hardcodes the language into the msi file name;
          # GitHub serves renamed assets under the new name, so the updater
          # manifest only needs its URL rewritten to match.
          tag="${GITHUB_REF_NAME}"
          release_api="repos/${{ github.repository }}/releases/tags/$tag"
          msi_assets=$(gh api "$release_api" --jq '.assets[] | select(.name | endswith("_en-US.msi")) | "\(.id) \(.name)"')
          if [ -z "$msi_assets" ]; then
            echo "No language-suffixed MSI assets to rename."
            exit 0
          fi
          while read -r asset_id asset_name; do
            new_name="${asset_name/_en-US.msi/.msi}"
            gh api --method PATCH "repos/${{ github.repository }}/releases/assets/$asset_id" -f name="$new_name" --jq '.name'
            echo "Renamed $asset_name -> $new_name"
          done <<< "$msi_assets"
          gh release download "$tag" --pattern "latest.json" --output latest.json || exit 0
          sed -i 's/_en-US\.msi/.msi/g' latest.json
          gh release upload "$tag" latest.json --clobber
