name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Notes come from the annotated tag message. Checkout may leave a
      # lightweight tag at the same name, so the script fetches the tag from
      # origin before reading it. A message missing either language marker
      # fails the release. The macOS xattr hint is appended outside the markers.
      - name: Collect release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/collect-release-notes.mjs

      - name: Install dependencies
        run: npm ci

      # Source manifests stay at 0.0.0. The git tag is the release version and
      # is written into the package only for this build.
      - name: Write the git tag into the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/stamp-release-version.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds both platforms in parallel; tauri-action creates the GitHub
      # release from the first finished job and uploads into it from the rest.
      # Artifacts are unsigned, so installers show the usual Gatekeeper and
      # SmartScreen first-run warnings.
      - name: Build and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Atrium v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

  normalize-assets:
    name: Normalize asset names
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Drop the WiX language suffix from MSI asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The WiX bundler hardcodes the language into the msi file name;
          # GitHub serves renamed assets under the new name, so the updater
          # manifest only needs its URL rewritten to match.
          tag="${GITHUB_REF_NAME}"
          release_api="repos/${{ github.repository }}/releases/tags/$tag"
          msi_assets=$(gh api "$release_api" --jq '.assets[] | select(.name | contains("_en-US.msi")) | "\(.id) \(.name)"')
          if [ -z "$msi_assets" ]; then
            echo "No language-suffixed MSI assets to rename."
            exit 0
          fi
          while read -r asset_id asset_name; do
            new_name="${asset_name/_en-US.msi/.msi}"
            gh api --method PATCH "repos/${{ github.repository }}/releases/assets/$asset_id" -f name="$new_name" --jq '.name'
            echo "Renamed $asset_name -> $new_name"
          done <<< "$msi_assets"
          if gh release download "$tag" --repo "${{ github.repository }}" --pattern "latest.json" --output latest.json; then
            if ! grep -q "_en-US.msi" latest.json; then
              echo "latest.json has no language-suffixed URLs."
              exit 0
            fi
            sed -i 's/_en-US\.msi/.msi/g' latest.json
            gh release upload "$tag" --repo "${{ github.repository }}" latest.json --clobber
            echo "latest.json rewritten"
          else
            echo "latest.json exists but could not be downloaded; the updater manifest still points at the old asset name." >&2
            exit 1
          fi
