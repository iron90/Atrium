schema = 2

[identity]
icon = "src-tauri/icons/icon.png"

[cleanup]
cache = ["node_modules/.vite"]
build = ["dist", "src-tauri/target"]

[[platforms]]
id = "macos"
label = "macOS"

[[platforms]]
id = "windows"
label = "Windows"

[[channels]]
id = "local-development"
label = "Local development"

[[build_profiles]]
id = "macos-local-development"
label = "macOS · Local development"
platform = "macos"
channel = "local-development"
artifacts = [
  "src-tauri/target/release/bundle/macos",
  "src-tauri/target/release/bundle/dmg",
]

[build_profiles.commands]
check = "package.json#scripts.quality"
build = "package.json#scripts.build:macos"
run = "package.json#scripts.dev"

# Lower compatibility boundary. CI exercises the quality gate on all three
# hosts; the macOS bundle and the desktop run entry only apply on macOS.
[build_profiles.host_requirements]
check = ["macos", "windows", "linux"]
build = ["macos"]
run = ["macos"]

# Hosts where the exact bound command passed the required postconditions on
# this machine (check: full quality gate exit 0; build: exit 0 with both
# declared artifacts produced during that run; run: desktop target started
# with devUrl readiness/smoke 200).
[build_profiles.verification]
check = ["macos"]
build = ["macos"]
run = ["macos"]

[[build_profiles]]
id = "windows-local-development"
label = "Windows · Local development"
platform = "windows"
channel = "local-development"
artifacts = [
  "src-tauri/target/release/bundle/msi",
  "src-tauri/target/release/bundle/nsis",
]

[build_profiles.commands]
check = "package.json#scripts.quality"
build = "package.json#scripts.build:windows"
run = "package.json#scripts.dev"

[build_profiles.host_requirements]
check = ["macos", "windows", "linux"]
build = ["windows"]
run = ["windows"]
