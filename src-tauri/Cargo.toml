[package]
name = "atrium"
# Placeholder. The release workflow writes the git tag here before packaging.
version = "0.0.0"
description = "A local-first visual project board"
authors = ["Atrium contributors"]
license = "MIT"
edition = "2021"
repository = "https://github.com/iron90/Atrium"

[lib]
name = "atrium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "process", "sync"] }
url = "2"
dunce = "1"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
